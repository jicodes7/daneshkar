<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation - Jalal Ahadi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Please fill in your details</p>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="At least 5 characters">
        <span class="error-msg" id="usernameError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Uppercase, lowercase & number">
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="submit">Submit</button>
    </form>

    <p class="success-msg" id="successMessage"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
